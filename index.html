<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatVerse Feed</title>

<style>
body{
  font-family:system-ui;
  background:#f5f7fb;
  margin:0;
  padding:20px;
}

h1{text-align:center}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

textarea,input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  background:#1a73e8;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
}

.post{
  margin-top:15px;
  border-bottom:1px solid #eee;
  padding-bottom:15px;
}

.post img{
  width:100%;
  border-radius:12px;
  margin-top:8px;
}

.time{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<h1>🇮🇳 BharatVerse</h1>

<div class="card">
  <h3>Create Post</h3>
  <textarea id="text" placeholder="Write something..."></textarea>
  <input type="file" id="file">
  <button onclick="publish()">Publish</button>
</div>

<div class="card">
  <h3>Feed</h3>
  <div id="feed"></div>
</div>

<script>
/* ===============================
   STORAGE
================================ */

function getIndex(){
  return JSON.parse(localStorage.getItem("posts") || "[]");
}

function saveIndex(p){
  localStorage.setItem("posts", JSON.stringify(p));
}

/* ===============================
   PUBLISH
================================ */

function publish(){
  const text = document.getElementById("text").value.trim();
  const file = document.getElementById("file").files[0];

  if(!text && !file){
    alert("Write something or select image");
    return;
  }

  if(file){
    const reader = new FileReader();
    reader.onload = () => {
      const posts = getIndex();
      posts.unshift({
        text,
        img: reader.result,
        time: new Date().toLocaleString()
      });
      saveIndex(posts);
      render();
    };
    reader.readAsDataURL(file);
  } else {
    const posts = getIndex();
    posts.unshift({
      text,
      img:null,
      time:new Date().toLocaleString()
    });
    saveIndex(posts);
    render();
  }

  document.getElementById("text").value="";
  document.getElementById("file").value="";
}

/* ===============================
   RENDER FEED
================================ */

function render(){
  const feed = document.getElementById("feed");
  feed.innerHTML="";

  getIndex().forEach(p=>{
    feed.innerHTML += `
      <div class="post">
        <div>${p.text}</div>
        ${p.img ? `<img src="${p.img}">` : ``}
        <div class="time">${p.time}</div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
