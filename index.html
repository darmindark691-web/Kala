<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:sans-serif;background:#f2f2f2;margin:0;padding:10px}
.card{background:#fff;padding:10px;margin-bottom:10px;border-radius:10px}
img{width:100%;border-radius:10px}
button{padding:10px;width:100%;font-size:16px}
input{width:100%;padding:8px;margin-bottom:6px}
</style>
</head>

<body>

<h3>🌍 Global Feed</h3>

<input type="file" id="img">
<input type="text" id="text" placeholder="Write something">
<button onclick="publish()">Publish</button>

<hr>

<div id="feed"></div>

<script>
const WORKER = "dark-hall-be40.darmindark691.workers.dev"; // 🔥 apna worker link

function loadFeed(){
  const feed = document.getElementById("feed");
  const posts = JSON.parse(localStorage.getItem("posts") || "[]");

  feed.innerHTML = "";

  posts.forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <p>${p.text}</p>
      <img src="${p.img}">
      <small>${new Date(p.time).toLocaleString()}</small>
    `;
    feed.appendChild(div);
  });
}

async function publish(){

  const file = document.getElementById("img").files[0];
  const text = document.getElementById("text").value;

  if(!file){
    alert("❌ Image select karo");
    return;
  }

  alert("⏳ Upload start");

  const fd = new FormData();
  fd.append("file", file);

  try{

    const res = await fetch(WORKER,{
      method:"POST",
      body: fd
    });

    const raw = await res.text();
    console.log(raw);

    let data;
    try{
      data = JSON.parse(raw);
    }catch(e){
      alert("❌ Worker JSON error");
      alert(raw);
      return;
    }

    if(!data.Hash){
      alert("❌ IPFS hash nahi mila");
      alert(raw);
      return;
    }

    const post = {
      text,
      img: "https://ipfs.io/ipfs/" + data.Hash,
      time: Date.now()
    };

    const posts = JSON.parse(localStorage.getItem("posts") || "[]");
    posts.unshift(post);
    localStorage.setItem("posts", JSON.stringify(posts));

    alert("✅ Post published");

    location.reload();

  }catch(err){
    alert("🔥 Network error");
    alert(err);
  }
}

loadFeed();
</script>

</body>
</html>
