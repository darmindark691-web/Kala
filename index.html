<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatVerse IPFS Feed</title>

<style>
body{font-family:system-ui;background:#f5f7fb;margin:0;padding:20px}
h1{text-align:center}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
textarea,input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#1a73e8;color:#fff;border:none;font-size:16px}
.post{margin-top:15px}
.post img{width:100%;border-radius:12px;margin-top:8px}
.time{font-size:12px;color:#777}
.did{font-size:12px;color:#555;text-align:center;margin-bottom:10px}
.tabs{display:flex;gap:10px;margin-bottom:10px}
.tabs button{flex:1}
</style>
</head>

<body>

<h1>🇮🇳 BharatVerse</h1>
<div class="did" id="did"></div>

<div class="tabs">
  <button onclick="showLocal()">My Posts</button>
  <button onclick="loadGlobalFeed()">Global Feed</button>
</div>

<div class="card">
<h3>Create Post</h3>
<textarea id="text" placeholder="Write something..."></textarea>
<input type="file" id="file">
<button onclick="publish()">Publish</button>
</div>

<div class="card">
<h3>Feed</h3>
<div id="feed"></div>
</div>

<script>
/* ===============================
   AUTO USER IDENTITY
================================ */
if(!localStorage.did){
  localStorage.did = "did:bharat:" + crypto.randomUUID();
}
document.getElementById("did").innerText =
"Your ID: " + localStorage.did;

/* ===============================
   STORAGE HELPERS
================================ */
function getIndex(){
  return JSON.parse(localStorage.getItem("index") || '{"posts":[]}');
}
function saveIndex(i){
  localStorage.setItem("index", JSON.stringify(i));
}

/* ===============================
   IPFS UPLOAD
================================ */
async function uploadToIPFS(file){
  const form = new FormData();
  form.append("file", file);

  const res = await fetch("https://ipfs.io/api/v0/add", {
    method:"POST",
    body:form
  });

  const text = await res.text();
  const hash = text.match(/Hash\":\"(.*?)\"/)[1];
  return hash;
}

/* ===============================
   POST PUBLISH
================================ */
async function publish(){
  const text = document.getElementById("text").value.trim();
  const file = document.getElementById("file").files[0];

  if(!text && !file){
    alert("Write something or select image");
    return;
  }

  let cid = null;
  if(file){
    cid = await uploadToIPFS(file);
  }

  const index = getIndex();
  index.posts.unshift({
    cid,
    text,
    time: new Date().toLocaleString()
  });

  saveIndex(index);
  document.getElementById("text").value="";
  document.getElementById("file").value="";
  renderLocal();
}

/* ===============================
   LOCAL FEED
================================ */
function renderLocal(){
  const feed = document.getElementById("feed");
  feed.innerHTML="";

  getIndex().posts.forEach(p=>{
    feed.innerHTML+=`
      <div class="post">
        <div>${p.text||""}</div>
        ${p.cid?`<img src="https://ipfs.io/ipfs/${p.cid}">`:``}
        <div class="time">${p.time}</div>
      </div>
    `;
  });
}

function showLocal(){
  renderLocal();
}

/* ===============================
   GLOBAL FEED
================================ */
const GLOBAL_USERS = [
  "https://raw.githubusercontent.com/demo/user1/index.json",
  "https://raw.githubusercontent.com/demo/user2/index.json",
  "https://raw.githubusercontent.com/demo/user3/index.json"
];

async function loadGlobalFeed(){
  const feed = document.getElementById("feed");
  feed.innerHTML = "🌍 Loading global feed...";

  let allPosts = [];

  for(const url of GLOBAL_USERS){
    try{
      const r = await fetch(url);
      const d = await r.json();
      d.posts.forEach(p=>{
        allPosts.push(p);
      });
    }catch(e){}
  }

  allPosts.sort((a,b)=> new Date(b.time)-new Date(a.time));
  feed.innerHTML="";

  allPosts.forEach(p=>{
    feed.innerHTML+=`
      <div class="post">
        <div>${p.text||""}</div>
        ${p.cid?`<img src="https://ipfs.io/ipfs/${p.cid}">`:``}
        <div class="time">${p.time}</div>
      </div>
    `;
  });
}

/* INIT */
renderLocal();
</script>

</body>
</html>
