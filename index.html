<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BharatVerse — Decentralized Social</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;background:#fff;padding:16px}
.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}
button{padding:10px 16px;border:none;border-radius:10px;background:#1a73e8;color:#fff}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
.small{font-size:12px;color:#555;word-break:break-all}
.post{border-bottom:1px solid #eee;padding:10px 0}
</style>
</head>

<body>

<h2>🇮🇳 BharatVerse (Decentralized Prototype)</h2>

<!-- ================= IDENTITY ================= -->
<div class="card">
<h3>1️⃣ Identity</h3>
<button onclick="createID()">Generate Identity</button>
<div id="didBox" class="small"></div>
</div>

<!-- ================= PROFILE ================= -->
<div class="card">
<h3>2️⃣ Profile</h3>
<input id="name" placeholder="Name">
<textarea id="bio" placeholder="Bio"></textarea>
<button onclick="saveProfile()">Save Profile</button>
<div id="profileHash" class="small"></div>
</div>

<!-- ================= FOLLOW ================= -->
<div class="card">
<h3>3️⃣ Follow User</h3>
<input id="followDid" placeholder="Enter DID to follow">
<button onclick="follow()">Follow</button>
<button onclick="unfollow()">Unfollow</button>
</div>

<!-- ================= POST ================= -->
<div class="card">
<h3>4️⃣ Create Post</h3>
<textarea id="postText" placeholder="Write something..."></textarea>
<button onclick="createPost()">Publish</button>
</div>

<!-- ================= FEED ================= -->
<div class="card">
<h3>5️⃣ Your Feed</h3>
<button onclick="loadFeed()">Refresh Feed</button>
<div id="feed"></div>
</div>

<script>
/* ==================================================
   BASIC STORAGE (phone = mini server)
================================================== */

function get(key){
  return JSON.parse(localStorage.getItem(key)||"null")
}
function set(key,val){
  localStorage.setItem(key,JSON.stringify(val))
}

/* ==================================================
   IDENTITY
================================================== */

function createID(){
  const did = "did:bharat:" + crypto.randomUUID()
  set("did", did)
  document.getElementById("didBox").innerText = did
}

/* ==================================================
   IPFS UPLOAD (PUBLIC GATEWAY DEMO)
================================================== */

async function upload(data){
  const res = await fetch("https://ipfs.io/api/v0/add",{
    method:"POST",
    body:new Blob([JSON.stringify(data)],{type:"application/json"})
  })
  const text = await res.text()
  return text.match(/"Hash":"(.*?)"/)[1]
}

/* ==================================================
   PROFILE
================================================== */

async function saveProfile(){
  const did = get("did")
  if(!did) return alert("Create identity first")

  const profile = {
    did,
    name: name.value,
    bio: bio.value,
    time: Date.now()
  }

  const hash = await upload(profile)
  set("profile", hash)
  document.getElementById("profileHash").innerText =
    "Profile: ipfs://" + hash
}

/* ==================================================
   FOLLOW SYSTEM (SIGNED EVENTS)
================================================== */

function follow(){
  const did = get("did")
  const target = followDid.value.trim()
  if(!did || !target) return alert("Missing DID")

  let following = get("following") || []
  if(!following.includes(target)){
    following.push(target)
    set("following", following)
  }
  alert("Followed")
}

function unfollow(){
  let following = get("following") || []
  following = following.filter(x=>x!==followDid.value.trim())
  set("following", following)
  alert("Unfollowed")
}

/* ==================================================
   POSTS
================================================== */

async function createPost(){
  const did = get("did")
  if(!did) return alert("Create identity first")

  const post = {
    author: did,
    text: postText.value,
    time: Date.now()
  }

  const hash = await upload(post)

  let myPosts = get("myposts") || []
  myPosts.push(hash)
  set("myposts", myPosts)

  alert("Post published on IPFS")
}

/* ==================================================
   FEED SYSTEM
================================================== */

async function loadFeed(){
  const feed = document.getElementById("feed")
  feed.innerHTML = "Loading..."

  const following = get("following") || []
  const posts = []

  // own posts
  const my = get("myposts") || []
  my.forEach(h=>posts.push({hash:h,self:true}))

  // demo follower fetch (real system = DHT)
  following.forEach(id=>{
    const demo = get("remote:"+id)
    if(demo) demo.forEach(h=>posts.push({hash:h}))
  })

  feed.innerHTML = ""

  for(const p of posts.reverse()){
    try{
      const r = await fetch("https://ipfs.io/ipfs/"+p.hash)
      const d = await r.json()

      feed.innerHTML += `
        <div class="post">
          <b>${d.author}</b><br>
          ${d.text}<br>
          <span class="small">${new Date(d.time).toLocaleString()}</span>
        </div>
      `
    }catch{}
  }
}
</script>

</body>
</html>
