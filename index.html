<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatVerse Global Feed</title>

<style>
body{font-family:system-ui;background:#f4f6fb;margin:0;padding:18px}
h1{text-align:center}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
textarea,input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#1a73e8;color:#fff;border:none;font-size:16px}
.post{margin-top:16px;padding-bottom:14px;border-bottom:1px solid #eee}
.post img{width:100%;border-radius:12px;margin-top:8px}
.time{font-size:12px;color:#777}
.note{text-align:center;font-size:12px;color:#666;margin-bottom:10px}
</style>
</head>

<body>

<h1>🇮🇳 BharatVerse</h1>
<div class="note">Global decentralized feed • no server • no login</div>

<div class="card">
<h3>Create Post</h3>
<textarea id="text" placeholder="Write something..."></textarea>
<input type="file" id="file" accept="image/*">
<button onclick="publish()">Publish</button>
</div>

<div class="card">
<h3>🌍 Global Feed</h3>
<div id="feed"></div>
</div>

<script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>

<script>
/* ===============================
   USER IDENTITY (AUTO)
================================ */
if(!localStorage.nostrPriv){
  const kp = NostrTools.generatePrivateKey()
  localStorage.nostrPriv = kp
}
const priv = localStorage.nostrPriv
const pub = NostrTools.getPublicKey(priv)

/* ===============================
   IMAGE UPLOAD (FREE RELAY)
================================ */
async function uploadImage(file){
  const form = new FormData()
  form.append("file", file)

  const res = await fetch("https://nostr.build/api/upload", {
    method:"POST",
    body:form
  })

  const data = await res.json()
  return data.url
}

/* ===============================
   PUBLISH POST
================================ */
async function publish(){
  const text = document.getElementById("text").value.trim()
  const file = document.getElementById("file").files[0]

  if(!text && !file){
    alert("Write something or select image")
    return
  }

  let imgURL = ""

  if(file){
    imgURL = await uploadImage(file)
  }

  const content =
    text + (imgURL ? "\n\n" + imgURL : "")

  const event = {
    kind: 1,
    pubkey: pub,
    created_at: Math.floor(Date.now()/1000),
    tags: [],
    content
  }

  event.id = NostrTools.getEventHash(event)
  event.sig = NostrTools.signEvent(event, priv)

  const relay = new WebSocket("wss://relay.damus.io")

  relay.onopen = () => {
    relay.send(JSON.stringify(["EVENT", event]))
    relay.close()
    document.getElementById("text").value=""
    document.getElementById("file").value=""
    alert("✅ Published globally")
  }
}

/* ===============================
   LOAD GLOBAL FEED
================================ */
function loadFeed(){
  const relay = new WebSocket("wss://relay.damus.io")
  const feed = document.getElementById("feed")

  relay.onopen = () => {
    relay.send(JSON.stringify([
      "REQ",
      "feed",
      { kinds:[1], limit:30 }
    ]))
  }

  relay.onmessage = msg => {
    const data = JSON.parse(msg.data)
    if(data[0]==="EVENT"){
      const e = data[2]
      feed.innerHTML += `
        <div class="post">
          <div>${e.content.replace(/(https?:\/\/\S+)/g,
            '<img src="$1">')}</div>
          <div class="time">
            ${new Date(e.created_at*1000).toLocaleString()}
          </div>
        </div>
      `
    }
  }
}

loadFeed()
</script>

</body>
</html>
