<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BharatVerse</title>

<style>
body{font-family:system-ui;background:#f5f7fb;padding:20px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px}
button{background:#1a73e8;color:white;border:none;padding:10px;border-radius:8px;width:100%}
.post img{width:100%;border-radius:10px;margin-top:8px}
</style>
</head>

<body>

<h2>🇮🇳 BharatVerse</h2>

<div class="card">
<textarea id="text" placeholder="Write something..."></textarea>
<input type="file" id="file">
<button onclick="publish()">Publish</button>
</div>

<div id="feed"></div>

<script>
function publish(){
  const text = document.getElementById("text").value;
  const file = document.getElementById("file").files[0];

  if(!text && !file){
    alert("Write something");
    return;
  }

  // Android bridge call
  window.Android.publishPost(text);
}

function showPost(text, img){
  const feed = document.getElementById("feed");
  feed.innerHTML =
    `<div class="card post">
      <div>${text}</div>
      ${img?`<img src="${img}">`:""}
    </div>` + feed.innerHTML;
}
</script>

</body>
</html>
