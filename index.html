<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BharatVerse — Decentralized Social Prototype</title><style>
body{
  font-family:system-ui;
  background:#f7f9fc;
  margin:0;
  padding:0;
}
.container{
  max-width:820px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#1a73e8;
  color:#fff;
  cursor:pointer;
}
input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
}
.post{
  border-top:1px solid #eee;
  padding-top:10px;
  margin-top:10px;
}
img{
  max-width:100%;
  border-radius:12px;
}
.small{color:#666;font-size:13px}
</style></head>
<body><div class="container">
<h2>🇮🇳 BharatVerse (Decentralized IPFS Prototype)</h2>
<p class="small">No server • No database • Runs in browser</p><!-- IDENTITY --><div class="card">
<h3>1️⃣ Identity</h3>
<button onclick="generateID()">Generate Identity</button>
<p class="small" id="did"></p>
</div><!-- PROFILE --><div class="card">
<h3>2️⃣ Profile</h3>
<input id="name" placeholder="Your name" />
<textarea id="bio" placeholder="Bio"></textarea>
<button onclick="saveProfile()">Save Profile</button>
</div><!-- CREATE POST --><div class="card">
<h3>3️⃣ Create Post</h3>
<textarea id="postText" placeholder="Write something..."></textarea>
<input type="file" id="image" />
<button onclick="publishPost()">Publish</button>
</div><!-- FEED --><div class="card">
<h3>4️⃣ Feed</h3>
<button onclick="loadFeed()">Refresh Feed</button>
<div id="feed"></div>
</div></div><script>
let identity = null
let posts = []

function generateID(){
  identity = "did:ipfs:" + crypto.randomUUID()
  localStorage.setItem("did", identity)
  document.getElementById("did").innerText = identity
}

function saveProfile(){
  const profile = {
    name: name.value,
    bio: bio.value
  }
  localStorage.setItem("profile", JSON.stringify(profile))
  alert("Profile saved locally")
}

async function publishPost(){
  if(!identity){ alert("Generate identity first"); return }

  const text = postText.value
  const file = image.files[0]

  let imageCID = null

  if(file){
    imageCID = await uploadToIPFS(file)
  }

  const post = {
    id: crypto.randomUUID(),
    author: identity,
    text,
    image: imageCID,
    time: Date.now()
  }

  posts.push(post)
  localStorage.setItem("posts", JSON.stringify(posts))

  postText.value = ""
  image.value = ""

  alert("Post published (IPFS-ready)")
}

async function uploadToIPFS(file){
  const form = new FormData()
  form.append("file", file)

  // public gateway upload demo
  const res = await fetch("https://ipfs.infura.io:5001/api/v0/add",{
    method:"POST",
    body: form
  })

  const text = await res.text()
  const hash = text.match(/"Hash":"(.*?)"/)
  return hash ? hash[1] : null
}

function loadFeed(){
  const feed = document.getElementById("feed")
  feed.innerHTML = ""

  const saved = JSON.parse(localStorage.getItem("posts")||"[]")

  saved.reverse().forEach(p=>{
    const div = document.createElement("div")
    div.className = "post"

    div.innerHTML = `
      <p><b>${p.author}</b></p>
      <p>${p.text}</p>
      ${p.image ? `<img src="https://ipfs.io/ipfs/${p.image}">` : ""}
      <p class="small">${new Date(p.time).toLocaleString()}</p>
    `

    feed.appendChild(div)
  })
}

// load identity
const savedID = localStorage.getItem("did")
if(savedID){
  identity = savedID
  document.getElementById("did").innerText = identity
}
</script></body>
</html>
