<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatVerse IPFS</title>

<style>
body{
  font-family:system-ui;
  background:#f4f6fb;
  margin:0;
  padding:15px;
}
h2{text-align:center}
.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 6px 15px rgba(0,0,0,.08);
}
textarea,input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#1a73e8;
  color:white;
  font-size:16px;
  border:none;
}
.post img{
  width:100%;
  border-radius:12px;
  margin-top:8px;
}
.time{
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<h2>🇮🇳 BharatVerse</h2>

<div class="card">
  <textarea id="text" placeholder="Write something..."></textarea>
  <input type="file" id="file">
  <button onclick="publish()">Publish</button>
</div>

<div class="card">
  <h3>Feed</h3>
  <div id="feed"></div>
</div>

<script>
/* =============================
   USER ID
============================= */
if(!localStorage.uid){
  localStorage.uid = "user-" + crypto.randomUUID();
}

/* =============================
   STORAGE
============================= */
function getPosts(){
  return JSON.parse(localStorage.getItem("posts") || "[]");
}

function savePosts(p){
  localStorage.setItem("posts", JSON.stringify(p));
}

/* =============================
   IPFS UPLOAD
============================= */
async function uploadToIPFS(file){

  const form = new FormData();
  form.append("file", file);

  const res = await fetch("https://api.nft.storage/upload", {
    method: "POST",
    headers:{
      "Authorization": "c35396b3.fe263b259c224980a6424d772cdc921e"
    },
    body: form
  });

  const data = await res.json();
  return "https://ipfs.io/ipfs/" + data.value.cid;
}

/* =============================
   PUBLISH POST
============================= */
async function publish(){

  const text = document.getElementById("text").value.trim();
  const file = document.getElementById("file").files[0];

  if(!text && !file){
    alert("Write something or choose image");
    return;
  }

  let image = null;

  if(file){
    image = await uploadToIPFS(file);
  }

  const posts = getPosts();

  posts.unshift({
    text,
    image,
    time: new Date().toLocaleString()
  });

  savePosts(posts);

  document.getElementById("text").value="";
  document.getElementById("file").value="";

  render();
}

/* =============================
   FEED
============================= */
function render(){
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  getPosts().forEach(p=>{
    feed.innerHTML += `
      <div class="post">
        <div>${p.text || ""}</div>
        ${p.image ? `<img src="${p.image}">` : ""}
        <div class="time">${p.time}</div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
