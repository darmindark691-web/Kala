<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatVerse Feed</title>

<style>
body{
  font-family:system-ui;
  background:#f5f7fb;
  margin:0;
  padding:15px;
}
h1{text-align:center}
.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#1a73e8;
  color:#fff;
  border:none;
}
.post{
  margin-top:15px;
}
.post img{
  width:100%;
  border-radius:12px;
  margin-top:8px;
}
.time{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<h1>🇮🇳 BharatVerse</h1>

<div class="card">
  <h3>Upload on IPFS</h3>
  <button onclick="openIPFS()">Open IPFS Upload</button>
  <input id="cid" placeholder="Paste IPFS CID here">
  <button onclick="publish()">Publish</button>
</div>

<div class="card">
  <h3>Feed</h3>
  <div id="feed"></div>
</div>

<script>
function openIPFS(){
  window.open("https://webui.ipfs.io", "_blank");
}

function getPosts(){
  return JSON.parse(localStorage.getItem("posts") || "[]");
}

function savePosts(p){
  localStorage.setItem("posts", JSON.stringify(p));
}

function publish(){
  const cid = document.getElementById("cid").value.trim();
  if(cid===""){
    alert("Paste IPFS CID");
    return;
  }

  const posts = getPosts();
  posts.unshift({
    cid: cid,
    time: new Date().toLocaleString()
  });

  savePosts(posts);
  document.getElementById("cid").value="";
  render();
}

function render(){
  const feed=document.getElementById("feed");
  feed.innerHTML="";
  getPosts().forEach(p=>{
    feed.innerHTML+=`
      <div class="post">
        <img src="https://ipfs.io/ipfs/${p.cid}">
        <div class="time">${p.time}</div>
      </div>
    `;
  });
}
render();
</script>

</body>
</html>
